# .github/workflows/cron-clima.yml
# DEPRECATED: ETL clima migrada para Supabase Edge Function + pg_cron
# (15min). Ver supabase/functions/etl-clima/index.ts e migration
# 032_etl_clima_pgcron.sql. Mantido apenas como backup manual.
name: ETL Clima (BACKUP — usar etl-clima edge function)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  etl-clima:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Executar ETL Clima
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/etl_clima.py
