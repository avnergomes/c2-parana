# .github/workflows/cron-alerts.yml
# DEPRECATED: ETL alerts migrada para Supabase Edge Function + pg_cron
# (*/30). Ver supabase/functions/etl-alerts/index.ts e migration
# 037_etl_fase1_pgcron.sql. Mantido apenas como backup manual.
name: ETL Alerts Engine (BACKUP — usar etl-alerts edge function)

on:
  workflow_dispatch:

jobs:
  etl-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Executar Alert Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/etl_alerts_engine.py
