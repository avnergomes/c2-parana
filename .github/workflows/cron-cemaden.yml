# .github/workflows/cron-cemaden.yml
# DEPRECATED: ETL cemaden migrada para Supabase Edge Function + pg_cron
# (*/30). Ver supabase/functions/etl-cemaden/index.ts e migration
# 037_etl_fase1_pgcron.sql. Mantido apenas como backup manual.
# Fase 5.A — CEMADEN alertas geo/hidrologicos
name: ETL CEMADEN (BACKUP — usar etl-cemaden edge function)

on:
  workflow_dispatch:

concurrency:
  group: etl-cemaden
  cancel-in-progress: true

jobs:
  etl-cemaden:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Executar ETL CEMADEN
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CEMADEN_UF: PR
        run: python scripts/etl_cemaden.py
