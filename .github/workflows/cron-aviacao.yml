# .github/workflows/cron-aviacao.yml
# DEPRECATED: ETL aviacao migrada para Supabase Edge Function +
# pg_cron (a cada 1min). Veja supabase/functions/etl-aviacao/index.ts
# e migration 031_etl_aviacao_pgcron.sql.
#
# Mantemos somente o trigger manual (workflow_dispatch) como backup
# caso a function fique indisponivel.
name: ETL Aviacao (BACKUP — usar etl-aviacao edge function)

on:
  workflow_dispatch:

concurrency:
  group: etl-aviacao
  cancel-in-progress: false

jobs:
  etl-aviacao:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Executar ETL Aviacao
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/etl_aviacao.py
