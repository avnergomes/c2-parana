# .github/workflows/cron-aviacao.yml
# Trafego aereo (airplanes.live) a cada 5min.
# API publica, sem auth, rate limit 1 req/s — cron 5min usa 288 reqs/dia.
# Budget: ~3min/dia (288 exec * ~30s).
name: ETL Aviacao (airplanes.live)

on:
  schedule:
    # Multiplos schedules offset para mitigar throttling do GH Actions free
    # tier (que documenta minimo de 5min mas frequentemente skipa runs).
    # Tres entradas offset dao ~1.67min efetivo se todas dispararem.
    - cron: '*/5 * * * *'
    - cron: '1-59/5 * * * *'
    - cron: '3-59/5 * * * *'
  workflow_dispatch:

concurrency:
  group: etl-aviacao
  cancel-in-progress: false

jobs:
  etl-aviacao:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Executar ETL Aviacao
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/etl_aviacao.py
